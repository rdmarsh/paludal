<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 486" width="320" role="img" color="#1f1d1a" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>How Paludal is built</title>
<desc>A chain of five boxes from top to bottom. The day (24 hours) divided by 100,000 (twelve to the fifth) gives the blink, 0.347 s. Light travels 2 × 10^7 paces a blink, which gives the pace, 1.45 m. A cube 0;1 pace on each side is the cub, 1.77 L. A cub of water weighs about a lib, 1.77 kg. Below, a bar one pace long is split into twelve uncs, and the first unc is drawn larger, split into twelve digs.</desc>
<rect class="panel" color="#f3f0ea" x="12" y="8" width="140" height="46" rx="8" fill="currentColor"/>
<rect class="fg" color="#1f1d1a" x="12" y="8" width="140" height="46" rx="8" fill="none" stroke="currentColor" stroke-width="1.2"/>
<text x="24" y="28" font-size="15" font-weight="700" fill="currentColor">day</text>
<text class="muted" color="#6b665e" x="24" y="45" font-size="11" fill="currentColor">24 hours</text>
<text class="muted" color="#6b665e" x="142" y="28" font-size="9" text-anchor="end" fill="currentColor">the Earth</text>
<g class="muted" color="#6b665e" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="40" y1="56" x2="40" y2="81"/><path d="M36 76 L40 81 L44 76"/></g>
<text x="166" y="63" font-size="11" fill="currentColor">÷ 100,000<tspan class="muted" color="#6b665e" x="166" dy="14">(twelve to the fifth)</tspan></text>
<rect class="panel" color="#f3f0ea" x="12" y="84" width="140" height="46" rx="8" fill="currentColor"/>
<rect class="accent" color="#9a4d1f" x="12" y="84" width="140" height="46" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="24" y="104" font-size="15" font-weight="700" fill="currentColor">blink</text>
<text class="muted" color="#6b665e" x="24" y="121" font-size="11" fill="currentColor">time · 0.347 s</text>
<text class="muted" color="#6b665e" x="142" y="104" font-size="9" text-anchor="end" fill="currentColor">base unit</text>
<g class="muted" color="#6b665e" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="40" y1="132" x2="40" y2="157"/><path d="M36 152 L40 157 L44 152"/></g>
<text x="166" y="139" font-size="11" fill="currentColor">light travels<tspan class="muted" color="#6b665e" x="166" dy="14">2 × 10⁷ paces a blink</tspan></text>
<rect class="panel" color="#f3f0ea" x="12" y="160" width="140" height="46" rx="8" fill="currentColor"/>
<rect class="accent" color="#9a4d1f" x="12" y="160" width="140" height="46" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="24" y="180" font-size="15" font-weight="700" fill="currentColor">pace</text>
<text class="muted" color="#6b665e" x="24" y="197" font-size="11" fill="currentColor">length · 1.45 m</text>
<text class="muted" color="#6b665e" x="142" y="180" font-size="9" text-anchor="end" fill="currentColor">base unit</text>
<g class="muted" color="#6b665e" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="40" y1="208" x2="40" y2="233"/><path d="M36 228 L40 233 L44 228"/></g>
<text x="166" y="215" font-size="11" fill="currentColor">a cube 0;1 pace<tspan class="muted" color="#6b665e" x="166" dy="14">on each side</tspan></text>
<rect class="panel" color="#f3f0ea" x="12" y="236" width="140" height="46" rx="8" fill="currentColor"/>
<rect class="fg" color="#1f1d1a" x="12" y="236" width="140" height="46" rx="8" fill="none" stroke="currentColor" stroke-width="1.2"/>
<text x="24" y="256" font-size="15" font-weight="700" fill="currentColor">cub</text>
<text class="muted" color="#6b665e" x="24" y="273" font-size="11" fill="currentColor">volume · 1.77 L</text>
<g class="muted" color="#6b665e" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="40" y1="284" x2="40" y2="309"/><path d="M36 304 L40 309 L44 304"/></g>
<text x="166" y="291" font-size="11" fill="currentColor">filled with water,<tspan class="muted" color="#6b665e" x="166" dy="14">weighs ≈ 1 lib</tspan></text>
<rect class="panel" color="#f3f0ea" x="12" y="312" width="140" height="46" rx="8" fill="currentColor"/>
<rect class="accent" color="#9a4d1f" x="12" y="312" width="140" height="46" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="24" y="332" font-size="15" font-weight="700" fill="currentColor">lib</text>
<text class="muted" color="#6b665e" x="24" y="349" font-size="11" fill="currentColor">mass · 1.77 kg</text>
<text class="muted" color="#6b665e" x="142" y="332" font-size="9" text-anchor="end" fill="currentColor">base unit</text>
<text x="12" y="394" font-size="12" font-weight="600" fill="currentColor">Every step is twelve</text>
<rect class="panel" color="#f3f0ea" x="12" y="408" width="296" height="14" fill="currentColor"/>
<rect class="accent" color="#9a4d1f" x="12" y="408" width="24.67" height="14" fill="currentColor" opacity="0.35"/>
<g class="fg" color="#1f1d1a" stroke="currentColor" stroke-width="1"><rect x="12" y="408" width="296" height="14" fill="none"/><line x1="36.67" y1="408" x2="36.67" y2="422"/><line x1="61.33" y1="408" x2="61.33" y2="422"/><line x1="86.00" y1="408" x2="86.00" y2="422"/><line x1="110.67" y1="408" x2="110.67" y2="422"/><line x1="135.33" y1="408" x2="135.33" y2="422"/><line x1="160.00" y1="408" x2="160.00" y2="422"/><line x1="184.67" y1="408" x2="184.67" y2="422"/><line x1="209.33" y1="408" x2="209.33" y2="422"/><line x1="234.00" y1="408" x2="234.00" y2="422"/><line x1="258.67" y1="408" x2="258.67" y2="422"/><line x1="283.33" y1="408" x2="283.33" y2="422"/></g>
<text class="muted" color="#6b665e" x="308" y="404" font-size="10" text-anchor="end" fill="currentColor">1 pace = 10 unc (12 dec)</text>
<g class="muted" color="#6b665e" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2 2"><line x1="12" y1="422" x2="12" y2="448"/><line x1="36.67" y1="422" x2="308" y2="448"/></g>
<rect class="panel" color="#f3f0ea" x="12" y="448" width="296" height="14" fill="currentColor"/>
<g class="accent" color="#9a4d1f" stroke="currentColor" stroke-width="1"><rect x="12" y="448" width="296" height="14" fill="none"/><line x1="36.67" y1="448" x2="36.67" y2="462"/><line x1="61.33" y1="448" x2="61.33" y2="462"/><line x1="86.00" y1="448" x2="86.00" y2="462"/><line x1="110.67" y1="448" x2="110.67" y2="462"/><line x1="135.33" y1="448" x2="135.33" y2="462"/><line x1="160.00" y1="448" x2="160.00" y2="462"/><line x1="184.67" y1="448" x2="184.67" y2="462"/><line x1="209.33" y1="448" x2="209.33" y2="462"/><line x1="234.00" y1="448" x2="234.00" y2="462"/><line x1="258.67" y1="448" x2="258.67" y2="462"/><line x1="283.33" y1="448" x2="283.33" y2="462"/></g>
<text class="muted" color="#6b665e" x="308" y="475" font-size="10" text-anchor="end" fill="currentColor">1 unc (12.1 cm) = 10 dig (≈ 1 cm each)</text>
</svg>
