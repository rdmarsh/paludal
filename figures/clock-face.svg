<title>A clock face in dozenal</title>
<desc>An ordinary twelve-hour clock face. The numbers 1 to 9 are unchanged. Ten o'clock is written X (dek), eleven o'clock E (el), and twelve at the top is written 10 (do): one full turn and nothing over. The old numbers 10, 11 and 12 are shown small outside the dial.</desc>
