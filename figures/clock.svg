<title>Paludal clock showing E91;7</title>
<desc>A 24-hour dial with twelve marks, 0 (midnight) at the bottom and 6 (noon) at the top, numbers running clockwise. Four hands, each twelve times faster than the last, each pointing at one digit of the time: hand 1 just before 0 (E), hand 2 just past 9, hand 3 between 1 and 2, hand 4 on 7. The time is E91;7, about 23:31.</desc>
